
name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      # Step 1: Configure RDP with NLA enabled
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          # Enable Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 -Force

          # Enable Network Level Authentication
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1 -Force

          # Enable TLS security layer
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' `
            -Value 2 -Force

          # Set high encryption level
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'MinEncryptionLevel' `
            -Value 3 -Force

          # Remove existing firewall rule
          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          # Allow RDP only from Tailscale IP range
          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389 `
            remoteip=100.64.0.0/10

          # Enable Remote Desktop firewall group
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # Ensure RDP service is running
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Write-Host "RDP configured with NLA and TLS."

      # Step 2: Create RDP user
      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $username = "mckrish"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw "RDP_PASSWORD secret is missing."
          }

          $securePass = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          # Create user if it does not exist
          $existingUser = Get-LocalUser -Name $username `
            -ErrorAction SilentlyContinue

          if ($null -eq $existingUser) {
              New-LocalUser `
                -Name $username `
                -Password $securePass `
                -AccountNeverExpires `
                -PasswordNeverExpires
          }
          else {
              # Update existing user's password
              Set-LocalUser `
                -Name $username `
                -Password $securePass
          }

          # Add user to Administrators
          $adminMember = Get-LocalGroupMember `
            -Group "Administrators" |
            Where-Object { $_.Name -match '\\mckrish$' }

          if (-not $adminMember) {
              Add-LocalGroupMember `
                -Group "Administrators" `
                -Member $username
          }

          # Add user to Remote Desktop Users
          $rdpMember = Get-LocalGroupMember `
            -Group "Remote Desktop Users" |
            Where-Object { $_.Name -match '\\mckrish$' }

          if (-not $rdpMember) {
              Add-LocalGroupMember `
                -Group "Remote Desktop Users" `
                -Member $username
          }

          # Verify account
          if (-not (Get-LocalUser -Name $username)) {
              throw "RDP user creation failed."
          }

          Write-Host "RDP user configured successfully."

      # Step 3: Install Tailscale
      - name: Install Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath

          Start-Process msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installerPath -Force

      # Step 4: Connect Tailscale
      - name: Establish Tailscale Connection
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
              throw "TAILSCALE_AUTH_KEY secret is missing."
          }

          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tsExe up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale connection failed."
          }

          # Wait for Tailscale IP
          $tsIP = $null

          for ($i = 0; $i -lt 20; $i++) {
              $tsIP = (& $tsExe ip -4 | Select-Object -First 1).Trim()

              if ($tsIP) {
                  break
              }

              Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
              throw "Tailscale IP was not assigned."
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host "Tailscale connected successfully."

      # Step 5: Verify RDP
      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          Start-Sleep -Seconds 5

          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $testResult.TcpTestSucceeded) {
              throw "RDP port 3389 connectivity failed."
          }

          Write-Host "RDP TCP connectivity successful."
          Write-Host "NLA authentication is enabled."

      # Step 6: Keep RDP active
      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========== RDP ACCESS =========="
          Write-Host "Address  : $env:TAILSCALE_IP"
          Write-Host "Username : mckrish"
          Write-Host "Password : Configured through GitHub Secrets"
          Write-Host "NLA      : Enabled"
          Write-Host "Security : TLS"
          Write-Host "================================"
          Write-Host ""

          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active"
              Start-Sleep -Seconds 300
          }
